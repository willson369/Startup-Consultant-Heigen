<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="黑根 AI 创业计划指导顾问" />
    <title>黑根 · 创业计划指导顾问</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#" aria-label="黑根首页">
          <span class="brand-mark">H</span>
          <span>黑根<small>HEIGEN</small></span>
        </a>
        <p class="sidebar-copy">把创业想法，变成经得起评委追问的商业逻辑。</p>
        <nav class="mode-nav" aria-label="顾问模式">
          <button class="mode-card active" data-mode="validation">
            <span class="mode-icon">◎</span>
            <span><strong>验证想法</strong><small>从问题与用户开始</small></span>
          </button>
          <button class="mode-card" data-mode="bp">
            <span class="mode-icon">▤</span>
            <span><strong>梳理 BP</strong><small>七段商业计划书</small></span>
          </button>
          <button class="mode-card" data-mode="pitch">
            <span class="mode-icon">◒</span>
            <span><strong>准备路演</strong><small>五分钟说清楚</small></span>
          </button>
          <button class="mode-card" data-mode="qa">
            <span class="mode-icon">?</span>
            <span><strong>模拟答辩</strong><small>接受评委压力测试</small></span>
          </button>
        </nav>
        <div class="sidebar-bottom">
          <button class="text-button" id="new-session">+ 新建咨询</button>
          <button class="text-button" id="clear-history">清除本地记录</button>
          <p>已支持后端持久化与联网检索；配置模型密钥后启用实时 AI 推理。建议不构成法律、财税或投资意见。</p>
        </div>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow" id="mode-label">创意与商业模式验证</p>
            <h1 id="page-title">先确认：谁真的在为这个问题痛苦？</h1>
          </div>
          <button class="export-button" id="export-session">导出本次咨询</button>
        </header>

        <section class="progress-panel" aria-label="咨询进度">
          <div class="progress-copy">
            <span id="stage-label">第 1 步 / 问题发现</span>
            <strong id="progress-text">先获得具体问题，再讨论方案。</strong>
          </div>
          <div class="progress-track"><span id="progress-bar"></span></div>
        </section>

        <section class="chat" id="chat" aria-live="polite"></section>

        <section class="quick-actions" id="quick-actions" aria-label="快捷输入"></section>

        <form class="composer" id="composer">
          <label class="sr-only" for="user-input">输入你的创业信息</label>
          <textarea
            id="user-input"
            rows="3"
            placeholder="例如：我观察到咖啡店店主每天都要花很多时间盘点原料……"
            required
          ></textarea>
          <button type="submit" id="send-button">发送 <span>↵</span></button>
        </form>
      </section>

      <aside class="insight-panel">
        <div class="panel-heading">
          <p class="eyebrow">项目看板</p>
          <h2>当前创业假设</h2>
        </div>
        <div class="signal-card">
          <span>当前模式</span>
          <strong id="board-mode">验证想法</strong>
        </div>
        <dl id="venture-board" class="venture-board">
          <div><dt>目标用户</dt><dd>待确认</dd></div>
          <div><dt>核心问题</dt><dd>待确认</dd></div>
          <div><dt>当前证据</dt><dd>待收集</dd></div>
          <div><dt>下一验证</dt><dd>描述你观察到的问题</dd></div>
        </dl>
        <div class="rubric">
          <p class="eyebrow">评委视角</p>
          <p id="rubric-tip">评委首先想知道：这个问题对谁、在什么场景下、痛到什么程度？</p>
        </div>
      </aside>
    </main>
    <template id="message-template">
      <article class="message">
        <div class="avatar"></div>
        <div class="message-content">
          <p class="message-name"></p>
          <div class="message-text"></div>
        </div>
      </article>
    </template>
    <script src="app.js"></script>
  </body>
</html>
